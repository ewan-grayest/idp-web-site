# Alternative to the Docker PaaS, not in use: everything on one server you run yourself: site + PostgreSQL + Caddy (free HTTPS from Let's Encrypt).
# Run from the site folder: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_STUDIO_PHONE: ${NEXT_PUBLIC_STUDIO_PHONE}
        NEXT_PUBLIC_PROMO_VIDEO_URL: ${NEXT_PUBLIC_PROMO_VIDEO_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://idp:${POSTGRES_PASSWORD}@db:5432/idp
      # Inside the container uploads always live here; MEDIA_DIR in deploy/.env picks where that is on the server
      MEDIA_DIR: /app/media
      # Backups made from the admin («Резервные копии»), in the same folder and format as scripts/backup.sh
      BACKUPS_DIR: /app/backups
      BACKUP_MODE: prod
    volumes:
      # Uploaded photos and videos: the Docker volume "media", or the folder set as MEDIA_DIR in deploy/.env
      - ${MEDIA_DIR:-media}:/app/media
      # Backups: deploy/backups on the server (the scripts use it too)
      - ./backups:/app/backups
      - nextcache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: idp
    volumes:
      # Database files: the Docker volume "pgdata", or the folder set as PGDATA_DIR in deploy/.env
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idp']
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  media:
  nextcache:
  caddydata:
