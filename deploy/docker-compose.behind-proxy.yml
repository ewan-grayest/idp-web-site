# The site and PostgreSQL for a host that already has its own proxy and HTTPS: a hosting panel, or nginx on a shared server.
# Data: deploy/data/{media,backup,db} on the server (DATA_DIR), at /data/{media,backup,db} inside the containers.
# docker-compose.prod.yml without Caddy, needing no settings file: values come from the panel's variables or from deploy/.env.
# Run from the site folder: docker compose -f deploy/docker-compose.behind-proxy.yml --env-file deploy/.env up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET to a long random string}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL to the site address, e.g. https://example.ru}
      NEXT_PUBLIC_STUDIO_PHONE: ${NEXT_PUBLIC_STUDIO_PHONE:-}
      NEXT_PUBLIC_PROMO_VIDEO_URL: ${NEXT_PUBLIC_PROMO_VIDEO_URL:-}
      DATABASE_URI: postgres://idp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a long random string}@db:5432/idp
      # The same paths in every setup ("Data locations" in CLAUDE.md)
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backup
      BACKUP_MODE: prod
    ports:
      - '${APP_BIND:-127.0.0.1:3000}:3000'
    volumes:
      # Uploaded photos and videos, and backups: the folders media and backup in DATA_DIR (default deploy/data)
      - ${DATA_DIR:-./data}/media:/data/media
      - ${DATA_DIR:-./data}/backup:/data/backup
      - nextcache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a long random string}
      POSTGRES_DB: idp
      PGDATA: /data/db
    volumes:
      # Database files: the folder db in DATA_DIR (default deploy/data)
      - ${DATA_DIR:-./data}/db:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idp']
      interval: 5s
      retries: 10

volumes:
  # Resized images only, rebuilt when missing
  nextcache:
