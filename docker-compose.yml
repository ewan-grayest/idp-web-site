# Runs the whole site in the local environment: the website/admin and its PostgreSQL database.
#   ./start.sh            build and start (first time and after code changes)
#   docker compose stop   stop; data is kept
# For development with live reload, start only the database: docker compose up -d db
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://idp:idp@db:5432/idp
      # Inside the container uploads always live here; MEDIA_DIR in .env picks where that is in the local environment
      MEDIA_DIR: /app/media
      # Backups made from the admin («Резервные копии»), in the same folder and format as scripts/backup.sh
      BACKUPS_DIR: /app/backups
      BACKUP_MODE: local
    ports:
      - '0.0.0.0:3000:3000' # other devices on this network can open the site; '127.0.0.1:3000:3000' = localhost only
    volumes:
      # Uploaded photos and videos: the Docker volume "media", or the folder set as MEDIA_DIR in .env
      - ${MEDIA_DIR:-media}:/app/media
      # Backups: the "backups" folder beside this file (the scripts use it too)
      - ./backups:/app/backups
      - nextcache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp
      POSTGRES_DB: idp
    ports:
      - '127.0.0.1:5432:5432' # for `npm run dev` in the local environment
    volumes:
      # Database files: the Docker volume "pgdata", or the folder set as PGDATA_DIR in .env
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idp']
      interval: 5s
      retries: 10

volumes:
  pgdata:
  media:
  nextcache:
