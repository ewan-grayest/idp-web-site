# Alternative to the Docker PaaS, not in use: everything on one server you run yourself: site + PostgreSQL + Caddy (free HTTPS from Let's Encrypt), each in its own container.
# Data: the persistent Docker volumes media, backup and db, mounted at /data/media, /data/backup and /data/db.
# Run from the site folder: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://idp:${POSTGRES_PASSWORD}@db:5432/idp
      # The same paths in every setup ("Data locations" in CLAUDE.md)
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backup
      BACKUP_MODE: prod
    volumes:
      # Persistent Docker volumes, the same in every setup ("Data locations" in CLAUDE.md)
      - media:/data/media
      - backup:/data/backup
      - nextcache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: idp
      PGDATA: /data/db
    volumes:
      # Database files: the persistent Docker volume "db"
      - db:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idp']
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  media:
  backup:
  db:
  # Resized images only, rebuilt when missing
  nextcache:
  caddydata:
