# Runs the whole site in the local environment: the website/admin and its PostgreSQL database, in separate containers.
#   ./start.sh            build and start (first time and after code changes)
#   docker compose stop   stop; data is kept
# For development with live reload, start only the database: docker compose up -d db
#
# Data locations, the same in every setup ("Data locations" in CLAUDE.md): persistent Docker volumes mounted at
#   /data/media   uploaded photos and videos (app)
#   /data/backup  backups (app; the scripts reach it through Docker)
#   /data/db      database files (db)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://idp:idp@db:5432/idp
      # Fixed inside the container, whatever .env says for `npm run dev`
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backup
      BACKUP_MODE: local
    ports:
      - '0.0.0.0:3000:3000' # other devices on this network can open the site; '127.0.0.1:3000:3000' = localhost only
    volumes:
      # Persistent Docker volumes
      - media:/data/media
      - backup:/data/backup
      - nextcache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp
      POSTGRES_DB: idp
      PGDATA: /data/db
    ports:
      - '127.0.0.1:5432:5432' # for `npm run dev` in the local environment
    volumes:
      - db:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idp']
      interval: 5s
      retries: 10

volumes:
  media:
  backup:
  db:
  # Resized images only, rebuilt when missing
  nextcache:
