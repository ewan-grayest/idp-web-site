# Production on one Yandex Cloud VM: site, PostgreSQL and Caddy (free HTTPS from Let's Encrypt), each in its own container.
# Data: deploy/data/{media,backup,db} on the server (DATA_DIR in deploy/.env), at /data/{media,backup,db} inside the containers.
# Run from the site folder: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://idp:${POSTGRES_PASSWORD}@db:5432/idp
      # The same paths in every setup ("Data locations" in CLAUDE.md)
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backup
      BACKUP_MODE: prod
    volumes:
      # Uploaded photos and videos, and backups: the folders media and backup in DATA_DIR (default deploy/data)
      - ${DATA_DIR:-./data}/media:/data/media
      - ${DATA_DIR:-./data}/backup:/data/backup
      - nextcache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: idp
      PGDATA: /data/db
    volumes:
      # Database files: the folder db in DATA_DIR (default deploy/data)
      - ${DATA_DIR:-./data}/db:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idp']
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  # Resized images only, rebuilt when missing
  nextcache:
  caddydata:
